<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Kuesioner AI XI-1</title>

<!-- jsPDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body {
    font-family: Arial;
    background: linear-gradient(135deg,#667eea,#764ba2);
    color: white;
    text-align: center;
    margin: 0;
}

.container {
    background: rgba(255,255,255,0.1);
    padding: 20px;
    margin: 20px auto;
    width: 90%;
    max-width: 500px;
    border-radius: 15px;
    animation: fadeIn 0.7s ease;
}

.logo {
    width: 80px;
    margin-bottom: 10px;
}

button {
    padding: 10px;
    margin-top: 15px;
    width: 100%;
    border: none;
    border-radius: 10px;
    background: #00c6ff;
    color: white;
    font-weight: bold;
}

label {
    display:block;
    text-align:left;
    margin:5px 0;
}

@keyframes fadeIn {
    from {opacity:0; transform:translateY(20px);}
    to {opacity:1; transform:translateY(0);}
}
</style>
</head>

<body>

<!-- LOGIN -->
<div class="container" id="login">
    <img src="logo.png" class="logo">
    <h2>Login Siswa</h2>
    <input type="text" id="nama" placeholder="Masukkan Nama" style="width:100%;padding:10px;">
    <button onclick="start()">Masuk</button>
</div>

<!-- SOAL -->
<div class="container" id="quiz" style="display:none;">
    <img src="logo.png" class="logo">
    <h2 id="pertanyaan"></h2>

    <div id="opsi"></div>

    <button onclick="next()">Next</button>
</div>

<!-- SELESAI -->
<div class="container" id="hasil" style="display:none;">
    <h2>Selesai!</h2>
    <p>Jawaban tersimpan & PDF siap dikirim</p>
</div>

<script>
let siswa = "";
let index = 0;
let jawaban = [];

const soal = [
"Apakah kamu tahu AI?",
"Seberapa sering pakai AI?",
"AI membantu belajar?",
"AI bikin malas?",
"AI bantu tugas sekolah?",
"AI meningkatkan nilai?",
"AI mudah digunakan?",
"AI membantu memahami materi?",
"AI menggantikan guru?",
"AI bikin ketergantungan?",
"AI membantu kreativitas?",
"AI penting di masa depan?",
"AI mempercepat kerja?",
"AI aman digunakan?",
"AI bantu cari ide?",
"AI bikin belajar menyenangkan?",
"AI cocok untuk semua pelajaran?",
"AI meningkatkan produktivitas?",
"AI perlu diawasi?",
"AI akan terus berkembang?"
];

function start(){
    siswa = document.getElementById("nama").value;
    if(!siswa) return alert("Isi nama dulu!");

    document.getElementById("login").style.display = "none";
    document.getElementById("quiz").style.display = "block";

    loadSoal();
}

function loadSoal(){
    document.getElementById("pertanyaan").innerText = soal[index];

    document.getElementById("opsi").innerHTML = `
        <label><input type="radio" name="opsi" value="Sangat Setuju"> Sangat Setuju</label>
        <label><input type="radio" name="opsi" value="Setuju"> Setuju</label>
        <label><input type="radio" name="opsi" value="Netral"> Netral</label>
        <label><input type="radio" name="opsi" value="Tidak Setuju"> Tidak Setuju</label>
    `;
}

function next(){
    let pilih = document.querySelector('input[name="opsi"]:checked');
    if(!pilih) return alert("Pilih jawaban!");

    jawaban.push(pilih.value);
    index++;

    if(index < soal.length){
        loadSoal();
    } else {
        selesai();
    }
}

function selesai(){
    document.getElementById("quiz").style.display = "none";
    document.getElementById("hasil").style.display = "block";

    localStorage.setItem("jawaban", JSON.stringify(jawaban));
    localStorage.setItem("nama", siswa);
    localStorage.setItem("tanggal", new Date().toDateString());
}
</script>

<script>
// AUTO CEK GANTI HARI
function cekGantiHari(){
    let last = localStorage.getItem("tanggal");
    let today = new Date().toDateString();

    if(last && last !== today){
        exportPDF();
        localStorage.setItem("tanggal", today);
    }
}

cekGantiHari();
</script>

<script>
// EXPORT PDF + WA
async function exportPDF(){
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();

    let dataJawaban = JSON.parse(localStorage.getItem("jawaban")) || [];
    let nama = localStorage.getItem("nama") || "Siswa";

    let y = 10;

    doc.text("Hasil Kuesioner AI",10,y); y+=10;
    doc.text("Nama: " + nama,10,y); y+=10;

    dataJawaban.forEach((j,i)=>{
        doc.text((i+1)+". "+soal[i],10,y);
        y+=6;
        doc.text("Jawaban: "+j,10,y);
        y+=8;

        if(y>270){ doc.addPage(); y=10; }
    });

    let blob = doc.output("blob");
    let url = URL.createObjectURL(blob);

    // buka WA
    let pesan = `Halo guru, ini hasil kuesioner saya (${nama}).`;
    let wa = `https://wa.me/?text=${encodeURIComponent(pesan)}`;
    window.open(wa, "_blank");

    // download PDF
    doc.save("Hasil_"+nama+".pdf");

    alert("PDF sudah didownload! Kirim ke WhatsApp ya.");
}
</script>

</body>
</html>
